name: CI
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Traer el código"
        uses: actions/checkout@v7
      - name: "Instalar JDK 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: "Verificar que corre JDK 17"
        run: java --version
      - name: "Correr la suite"
        run: ./mvnw -B verify
